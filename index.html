<script>
  /* 首屏前恢复主题，避免闪白 */
  try {
    var t = localStorage.getItem('designerdb:v1:theme') || 'system';
    var dark = t === 'dark' || (t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    var accents = ['red', 'orange', 'yellow', 'green', 'cyan', 'blue', 'purple'];
    var accent = localStorage.getItem('designerdb:v1:accent');
    if (accents.indexOf(accent) < 0) accent = 'blue';
    document.documentElement.setAttribute('data-accent', accent);
    var map = { red: '#d93b35', orange: '#e06a24', yellow: '#d5a01d', green: '#2f8f57', cyan: '#1d8b9b', blue: '#1b18ff', purple: '#7a3edb' };
    document.documentElement.style.setProperty('--accent', map[accent]);
  } catch (e) {}
</script>
